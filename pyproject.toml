[project]
name = "diary-recorder"
version = "0.1.0"
description = "A CLI diary tool that manages markdown-based daily journals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
diary-recorder = "diary_recorder.cli:main"

[tool.setuptools.packages.find]
include = ["diary_recorder*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.1",
]

[tool.ruff.lint.isort]
known-first-party = ["diary_recorder"]
